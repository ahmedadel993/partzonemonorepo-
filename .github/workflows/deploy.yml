name: Deploy to Monster ASP.NET

on:
  push:
    branches: [development]

jobs:
  deploy-backend-admin:
    name: Backend + Admin → partzoneadmin.runasp.net
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g pnpm@10.28.0

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin dashboard
        run: pnpm --filter admin-dashboard build
        env:
          VITE_GRAPHQL_URL: https://partzoneadmin.runasp.net/graphql
          VITE_API_URL: https://partzoneadmin.runasp.net/api/v1

      - name: Copy admin dist into backend wwwroot
        run: |
          mkdir -p backend/src/PartZone.Host/wwwroot/admin
          cp -r admin-dashboard/dist/. backend/src/PartZone.Host/wwwroot/admin/

      - name: Inject production secrets
        run: |
          cat > backend/src/PartZone.Host/appsettings.Secrets.json << 'ENDOFJSON'
          {
            "ConnectionStrings": { "Default": "${{ secrets.DB_CONNECTION_STRING }}" },
            "Jwt": {
              "SecretKey": "${{ secrets.JWT_SECRET_KEY }}",
              "Issuer": "https://partzoneadmin.runasp.net",
              "Audience": "partzone-clients"
            },
            "APPLY_MIGRATIONS": true
          }
          ENDOFJSON

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish backend
        run: |
          dotnet publish backend/src/PartZone.Host/PartZone.Host.csproj \
            -c Release -o ./publish-backend \
            --self-contained false

      - name: Copy admin assets alongside DLLs
        run: |
          mkdir -p ./publish-backend/admin
          cp -r admin-dashboard/dist/. ./publish-backend/admin/

      - name: Take app offline (release DLL locks)
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD_ADMIN }}
        run: |
          python3 - << 'PY'
          import ftplib, io, os
          ftp = ftplib.FTP('site111260.siteasp.net')
          ftp.login('site111260', os.environ['FTP_PASS'])
          ftp.storbinary('STOR wwwroot/app_offline.htm',
                         io.BytesIO(b'<html><body>Deploying update...</body></html>'))
          ftp.quit()
          print('app_offline.htm uploaded — app is offline')
          PY
          sleep 8

      - name: FTP deploy to site111260
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: site111260.siteasp.net
          username: site111260
          password: ${{ secrets.FTP_PASSWORD_ADMIN }}
          local-dir: ./publish-backend/
          server-dir: /wwwroot/
          exclude: |
            **/.git*

      - name: Bring app back online
        if: always()
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD_ADMIN }}
        run: |
          python3 - << 'PY'
          import ftplib, os
          ftp = ftplib.FTP('site111260.siteasp.net')
          ftp.login('site111260', os.environ['FTP_PASS'])
          try:
              ftp.delete('wwwroot/app_offline.htm')
              print('app_offline.htm deleted — app is back online')
          except ftplib.error_perm as e:
              print(f'Note: {e}')
          ftp.quit()
          PY

  deploy-storefront:
    name: Storefront → partzone.runasp.net
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g pnpm@10.28.0

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build storefront (standalone)
        run: pnpm --filter storefront build
        env:
          NEXT_PUBLIC_API_URL: http://partzoneadmin.runasp.net/api/v1

      - name: Package standalone output
        run: |
          mkdir -p ./publish-storefront
          cp -rL storefront/.next/standalone/. ./publish-storefront/
          mkdir -p ./publish-storefront/storefront/.next/static
          cp -r storefront/.next/static/. ./publish-storefront/storefront/.next/static/
          cp -r storefront/public/. ./publish-storefront/storefront/public/
          cp storefront/web.config ./publish-storefront/web.config

      - name: Take storefront offline (release file locks)
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD_STOREFRONT }}
        run: |
          python3 - << 'PY'
          import ftplib, io, os
          ftp = ftplib.FTP('site111263.siteasp.net')
          ftp.login('site111263', os.environ['FTP_PASS'])
          ftp.storbinary('STOR wwwroot/app_offline.htm',
                         io.BytesIO(b'<html><body>Deploying update...</body></html>'))
          ftp.quit()
          print('app_offline.htm uploaded — storefront is offline')
          PY
          sleep 8

      - name: FTP deploy to site111263
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: site111263.siteasp.net
          username: site111263
          password: ${{ secrets.FTP_PASSWORD_STOREFRONT }}
          local-dir: ./publish-storefront/
          server-dir: /wwwroot/
          exclude: |
            **/.git*

      - name: Bring storefront back online
        if: always()
        env:
          FTP_PASS: ${{ secrets.FTP_PASSWORD_STOREFRONT }}
        run: |
          python3 - << 'PY'
          import ftplib, os
          ftp = ftplib.FTP('site111263.siteasp.net')
          ftp.login('site111263', os.environ['FTP_PASS'])
          try:
              ftp.delete('wwwroot/app_offline.htm')
              print('app_offline.htm deleted — storefront is back online')
          except ftplib.error_perm as e:
              print(f'Note: {e}')
          ftp.quit()
          PY
