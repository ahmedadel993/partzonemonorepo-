extend type Query {
  brands: [BrandType!]!
  brand(slug: String!): BrandType
  brandById(id: ID!): BrandType
  categories: [CategoryType!]!
  category(slug: String!): CategoryType
  categoryById(id: ID!): CategoryType
  products(filter: ProductFilterInput!): ProductPageType!
  product(slug: String!): ProductDetailType
  productById(id: ID!): ProductDetailType
  vehicleMakes: [VehicleMakeType!]!
  vehicleMakeById(id: ID!): VehicleMakeType
  vehicleModels(makeId: ID!): [VehicleModelType!]!
  vehicleModelById(id: ID!): VehicleModelType
  vehicleYears(modelId: ID!): [VehicleYearRangeType!]!
}

extend type Mutation {
  createBrand(input: CreateBrandInput!): BrandPayload!
  updateBrand(input: UpdateBrandInput!): BrandPayload!
  activateBrand(brandId: ID!): BrandPayload!
  deactivateBrand(brandId: ID!): BrandPayload!
  deleteBrand(id: ID!): DeletePayload!
  createCategory(input: CreateCategoryInput!): CategoryPayload!
  updateCategory(input: UpdateCategoryInput!): CategoryPayload!
  activateCategory(id: ID!): CategoryPayload!
  deactivateCategory(id: ID!): CategoryPayload!
  deleteCategory(id: ID!): DeletePayload!
  createVehicleMake(input: CreateVehicleMakeInput!): VehicleMakePayload!
  updateVehicleMake(input: UpdateVehicleMakeInput!): VehicleMakePayload!
  deleteVehicleMake(id: ID!): DeletePayload!
  createVehicleModel(input: CreateVehicleModelInput!): VehicleModelPayload!
  updateVehicleModel(input: UpdateVehicleModelInput!): VehicleModelPayload!
  deleteVehicleModel(id: ID!): DeletePayload!
  deleteProduct(id: ID!): DeletePayload!
  createProduct(input: CreateProductInput!): ProductPayload!
  updateProduct(input: UpdateProductInput!): ProductPayload!
  publishProduct(productId: ID!): ProductPayload!
  unpublishProduct(productId: ID!): ProductPayload!
  updateProductStock(input: UpdateProductStockInput!): ProductPayload!
  addProductFitment(input: AddProductFitmentInput!): ProductPayload!
  addProductImage(input: AddProductImageInput!): ProductPayload!
  removeProductImage(productId: ID!, imageId: ID!): ProductPayload!
  setPrimaryProductImage(productId: ID!, imageId: ID!): ProductPayload!
}

# ── Output types ──────────────────────────────────────────────────────────────
# Field names match C# DTO property names for zero-friction schema-first binding.

type BrandType {
  id: ID!
  name: String!
  slug: String!
  logoUrl: String
  isActive: Boolean!
  # Phase 3 – display flags
  isFeatured: Boolean!
  showInHome: Boolean!
  isSponsored: Boolean!
}

type CategoryType {
  id: ID!
  name: String!
  slug: String!
  imageUrl: String
  sortOrder: Int!
  parentId: ID
  # Phase 3 – display flags
  isActive: Boolean!
  isFeatured: Boolean!
  showInHome: Boolean!
  showInMenu: Boolean!
  children: [CategoryType!]!
}

type VehicleMakeType {
  id: ID!
  name: String!
  slug: String!
  logoUrl: String
}

type VehicleModelType {
  id: ID!
  name: String!
  slug: String!
  vehicleMakeId: ID!
}

type VehicleYearRangeType {
  id: ID!
  yearFrom: Int!
  yearTo: Int!
  vehicleModelId: ID!
}

type ProductSummaryType {
  id: ID!
  sku: String!
  slug: String!
  name: String!
  condition: String!
  priceAmount: Float!
  priceCurrency: String!
  stock: Int!
  isPublished: Boolean!
  # Phase 3 – display flags
  isFeatured: Boolean!
  isBestSeller: Boolean!
  isNew: Boolean!
  isOnSale: Boolean!
  primaryImageUrl: String
  categoryName: String!
  brandName: String!
  brandId: ID!
  categoryId: ID!
}

type ProductDetailType {
  id: ID!
  sku: String!
  oemNumber: String!
  slug: String!
  name: String!
  description: String
  condition: String!
  priceAmount: Float!
  priceCurrency: String!
  stock: Int!
  isPublished: Boolean!
  # Phase 3 – display flags
  isFeatured: Boolean!
  isBestSeller: Boolean!
  isNew: Boolean!
  isOnSale: Boolean!
  avgRating: Float!
  reviewCount: Int!
  brand: BrandType!
  category: CategoryType!
  images: [ProductImageType!]!
  fitments: [ProductFitmentType!]!
}

type ProductImageType {
  id: ID!
  url: String!
  altText: String
  isPrimary: Boolean!
}

type ProductFitmentType {
  id: ID!
  modelId: ID!
  modelName: String!
  yearFrom: Int!
  yearTo: Int!
}

type ProductPageType {
  items: [ProductSummaryType!]!
  totalCount: Int!
  page: Int!
  pageSize: Int!
  totalPages: Int!
}

# ── Payloads ──────────────────────────────────────────────────────────────────

type BrandPayload {
  brand: BrandType
  errors: [String!]!
}

type CategoryPayload {
  category: CategoryType
  errors: [String!]!
}

type VehicleMakePayload {
  make: VehicleMakeType
  errors: [String!]!
}

type VehicleModelPayload {
  model: VehicleModelType
  errors: [String!]!
}

type DeletePayload {
  errors: [String!]!
}

type ProductPayload {
  product: ProductDetailType
  errors: [String!]!
}

# ── Input types ───────────────────────────────────────────────────────────────

input ProductFilterInput {
  q: String
  categoryId: ID
  brandId: ID
  condition: String
  vehicleModelId: ID
  # Phase 3 – display-flag filters
  isFeatured: Boolean
  isBestSeller: Boolean
  isNew: Boolean
  isOnSale: Boolean
  page: Int
  pageSize: Int
}

input CreateBrandInput {
  name: String!
  slug: String!
  logoUrl: String
}

input UpdateBrandInput {
  id: ID!
  name: String!
  logoUrl: String
  # Phase 3 – display flags
  isFeatured: Boolean
  showInHome: Boolean
  isSponsored: Boolean
}

input CreateCategoryInput {
  name: String!
  slug: String!
  iconUrl: String
  sortOrder: Int!
  parentId: ID
}

input UpdateCategoryInput {
  id: ID!
  name: String!
  imageUrl: String
  sortOrder: Int!
  # Phase 3 – display flags
  isActive: Boolean
  isFeatured: Boolean
  showInHome: Boolean
  showInMenu: Boolean
}

input CreateVehicleMakeInput {
  name: String!
  slug: String!
  logoUrl: String
}

input CreateVehicleModelInput {
  name: String!
  slug: String!
  vehicleMakeId: ID!
}

input UpdateVehicleMakeInput {
  id: ID!
  name: String!
  logoUrl: String
}

input UpdateVehicleModelInput {
  id: ID!
  name: String!
}

input CreateProductInput {
  sku: String!
  oemNumber: String!
  slug: String!
  condition: String!
  priceAmount: Float!
  priceCurrency: String!
  stock: Int!
  brandId: ID!
  categoryId: ID!
  translations: [ProductTranslationInputType!]!
}

input ProductTranslationInputType {
  locale: String!
  name: String!
  description: String
}

input UpdateProductStockInput {
  productId: ID!
  newStock: Int!
}

input AddProductImageInput {
  productId: ID!
  url: String!
  altText: String
  isPrimary: Boolean
}

input AddProductFitmentInput {
  productId: ID!
  vehicleModelId: ID!
  yearFrom: Int!
  yearTo: Int!
}

input UpdateProductInput {
  productId: ID!
  slug: String
  condition: String
  priceAmount: Float
  priceCurrency: String
  brandId: ID
  categoryId: ID
  translations: [ProductTranslationInputType!]
  # Phase 3 – display flags
  isFeatured: Boolean
  isBestSeller: Boolean
  isNew: Boolean
  isOnSale: Boolean
}
